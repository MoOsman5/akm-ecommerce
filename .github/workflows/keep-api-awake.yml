# Render's free tier puts the API to sleep after ~15 minutes without traffic,
# so the first visitor waits up to a minute for products to load.
# This pings the health endpoint every 10 minutes to keep it warm.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 \
            https://akm-ecommerce.onrender.com/api/health
